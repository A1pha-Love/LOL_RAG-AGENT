[project]
name = "lol-ranked-data-agent"
version = "0.1.0"
description = "A League of Legends ranked data analysis agent with RAG"
requires-python = ">=3.14,<3.15"
readme = "README.md"
# Metadata only: the MIT grant covers this project's own source code. Riot's Data
# Dragon material that the repository bundles is under Riot's own terms — see the
# third-party section at the end of the LICENSE file.
license = "MIT"
license-files = ["LICENSE"]
dependencies = [
    "langgraph==1.2.14",
    "langchain-openai==1.6.7",
    "python-dotenv==1.2.4",
    # Imported directly by lol_agent.embeddings, so it must not rely on being a
    # transitive dependency of langchain-openai.
    "openai>=3.26.0",
    # HTTP backend (apps/api.py): answers stream over Server-Sent Events.
    "fastapi>=0.143.0",
    "uvicorn[standard]>=0.54.0",
    "sse-starlette>=3.5.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.1.1",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
# -p no:cacheprovider: the .pytest_cache directory is not writable in a confined
# sandbox, which otherwise turns every run into an error.
addopts = "-q -p no:cacheprovider"
pythonpath = ["src"]
